[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
# river-client needs Python >= 3.12; contracts §6b was verified against 0.12.0.
train = ["river-client>=0.12,<0.13; python_version >= '3.12'", "transformers"]
test = ["pytest"]

[project.scripts]
graduate = "graduate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]  # demo-repo/tests fail on purpose

# ui/ and fixtures/ ship beside graduate/ (site-packages/ui, site-packages/fixtures), where the router's
# `parents[2]` paths look for the dashboard and prices, so `uvx --from git+... graduate up --demo` works without a clone.
[tool.setuptools.packages.find]
include = ["graduate*", "ui", "fixtures"]

[tool.setuptools.package-data]
ui = ["*"]
fixtures = ["*.json", "*.jsonl"]
