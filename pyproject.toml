[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
# river-client needs Python >= 3.12; contracts §6b was verified against 0.12.0.
train = ["river-client>=0.12,<0.13", "transformers"]

[project.scripts]
graduate = "graduate.runner:main"

[tool.setuptools.packages.find]
include = ["graduate*"]
