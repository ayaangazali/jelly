<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graduate mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF0F3;
  --sheet: #F8F9FB;
  --ink: #17213A;
  --muted: #5B6478;
  --rule: #CBD1DA;
  --owned: #3B3FB6;
  --owned-wash: #E3E4F7;
  --rented: #98A1B0;
  --pass: #1E7A57;
  --fail: #B3261E;
  --warn: #9A5F00;
  --focus: #3B3FB6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151F; --sheet: #171E2B; --ink: #E6E9EF; --muted: #9AA3B4; --rule: #2A3345;
    --owned: #9A9DFF; --owned-wash: #232852; --rented: #5C6678; --pass: #4CC08E; --fail: #FF7A6E; --warn: #E0A840;
    --focus: #9A9DFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151F; --sheet: #171E2B; --ink: #E6E9EF; --muted: #9AA3B4; --rule: #2A3345;
  --owned: #9A9DFF; --owned-wash: #232852; --rented: #5C6678; --pass: #4CC08E; --fail: #FF7A6E; --warn: #E0A840;
  --focus: #9A9DFF; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 "Archivo", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

header.top { border-bottom: 1px solid var(--rule); background: var(--sheet); }
header.top .wrap { display: flex; align-items: center; gap: 28px; min-height: 60px; flex-wrap: wrap; }
.brand { font-weight: 800; font-stretch: 125%; font-size: 19px; letter-spacing: -0.01em; text-decoration: none; }
nav.primary { display: flex; gap: 20px; }
nav.primary a { text-decoration: none; color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
nav.primary a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
.proxy { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); display: inline-block; }

.mockbar { background: var(--owned-wash); border-bottom: 1px solid var(--rule); font-size: 13px; }
.mockbar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.mockbar strong { font-weight: 600; margin-right: 6px; }
.btn {
  border: 1px solid var(--ink); background: transparent; padding: 7px 14px; border-radius: 4px; cursor: pointer;
  font-weight: 500;
}
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.owned { background: var(--owned); border-color: var(--owned); color: #fff; }
.btn.quiet { border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

main { padding: 32px 0 64px; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.015em; }
h2 { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
.lede { color: var(--muted); margin: 0; max-width: 64ch; }

.savings { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; }
.savings .amount { font-size: 54px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.03em; line-height: 1; color: var(--owned); }
.savings .what { max-width: 40ch; }
.savings .what small { display: block; color: var(--muted); font-size: 13px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }

.roster { width: 100%; border-collapse: collapse; }
.roster th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.roster td { padding: 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.roster tr:last-child td { border-bottom: 0; }
.roster tbody tr { cursor: pointer; }
.roster tbody tr:hover td { background: color-mix(in srgb, var(--owned-wash) 45%, transparent); }
.roster .name a { font-weight: 600; text-decoration: none; }
.roster .name code { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.roster .num { white-space: nowrap; }
.roster .num s { color: var(--muted); text-decoration-thickness: 1px; }
.roster .route { font-size: 13px; color: var(--muted); white-space: nowrap; }
.roster .route.owned { color: var(--owned); font-weight: 600; }
.unclassified td { color: var(--muted); font-size: 13.5px; cursor: default; }
@media (max-width: 720px) {
  .roster thead { display: none; }
  .roster, .roster tbody, .roster tr, .roster td { display: block; width: 100%; }
  .roster td { border: 0; padding: 4px 14px; }
  .roster tr { border-bottom: 1px solid var(--rule); padding: 10px 0; }
  .roster td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 12.5px; }
}

.state { font-stretch: 125%; font-weight: 700; font-size: 13px; letter-spacing: 0.01em; }
.state.LEARNING { color: var(--muted); }
.state.READY { color: var(--warn); }
.state.TRAINING { color: var(--owned); }
.state.GRADUATED { color: var(--owned); }
.state.PROBATION { color: var(--fail); }
.pips { display: inline-flex; gap: 3px; margin-top: 5px; }
.pips i { width: 14px; height: 6px; border-radius: 1px; background: var(--rule); }
.pips i.on { background: var(--ink); }
.trainbar { height: 6px; width: 90px; background: var(--rule); border-radius: 1px; margin-top: 6px; overflow: hidden; }
.trainbar b { display: block; height: 100%; background: var(--owned); width: 0; transition: width .4s linear; }

.log { max-height: 560px; overflow: auto; }
.log ol { list-style: none; margin: 0; padding: 0; }
.log li { padding: 10px 16px; border-bottom: 1px solid var(--rule); font-size: 13.5px; display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.log .pass { color: var(--pass); font-weight: 600; }
.log .fail { color: var(--fail); font-weight: 600; }
.log .owned { color: var(--owned); font-weight: 600; }
.log .fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: var(--owned-wash); } to { background: transparent; } }
.log header { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
.log header h2 { margin: 0; }
.log header span { color: var(--muted); font-size: 12.5px; }

.banner { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 20px; border: 1px solid var(--warn); border-left-width: 4px; border-radius: 6px; background: var(--sheet); }
.banner p { margin: 0; }

.detail-head { display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 24px; position: relative; }
.back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--ink); }

.stamp {
  display: inline-block; border: 3px double var(--owned); color: var(--owned); border-radius: 6px;
  padding: 6px 16px 4px; font-weight: 800; font-stretch: 125%; font-size: 26px; letter-spacing: 0.02em;
  transform: rotate(-6deg); opacity: .92; line-height: 1.1; text-align: center;
}
.stamp small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; font-stretch: 100%; }
.stamp.probation { border-color: var(--fail); color: var(--fail); }
.stamp.land { animation: land .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes land { from { transform: rotate(-14deg) scale(1.9); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: .92; } }

.lifecycle { display: grid; grid-template-columns: repeat(5, 1fr); margin: 0 0 28px; padding: 0; list-style: none; counter-reset: step; }
.lifecycle li { padding: 12px 12px 10px; border-top: 4px solid var(--rule); font-size: 13px; color: var(--muted); }
.lifecycle li b { display: block; font-stretch: 125%; font-size: 13px; color: var(--muted); }
.lifecycle li.done { border-color: var(--ink); }
.lifecycle li.done b { color: var(--ink); }
.lifecycle li.now { border-color: var(--owned); }
.lifecycle li.now b { color: var(--owned); }
.lifecycle li.now.PROBATION { border-color: var(--fail); }
.lifecycle li.now.PROBATION b { color: var(--fail); }
@media (max-width: 720px) { .lifecycle { grid-template-columns: 1fr; } }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-bottom: 24px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.pad { padding: 18px 20px; }

.compare { display: grid; gap: 16px; }
.metric .label { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; }
.metric .label span:last-child { color: var(--muted); }
.bar { display: grid; grid-template-columns: 78px 1fr 64px; align-items: center; gap: 10px; font-size: 12.5px; margin-top: 4px; }
.bar .track { height: 12px; background: color-mix(in srgb, var(--rule) 50%, transparent); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 2px; }
.bar.rented .fill { background: var(--rented); }
.bar.owned .fill { background: var(--owned); }
.bar .v { text-align: right; }
.note { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }

dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

table.runs { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.runs th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
table.runs td { padding: 9px 12px; border-bottom: 1px solid var(--rule); }
table.runs tr:last-child td { border-bottom: 0; }
.exit0 { color: var(--pass); font-weight: 600; }
.exit1 { color: var(--fail); font-weight: 600; }
.tbl-scroll { overflow-x: auto; }

.consent { max-width: 780px; }
.consent h1 { margin-bottom: 10px; }
.consent section { margin-top: 22px; }
.consent ul { margin: 0; padding-left: 18px; }
.consent li { margin: 3px 0; }
pre.sample { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; overflow: auto; line-height: 1.45; margin: 0; }

.setup { max-width: 820px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 22px 0 0; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tabpanel { padding: 18px 0; }
pre.cmd { background: var(--ink); color: var(--sheet); padding: 14px 16px; border-radius: 4px; overflow: auto; margin: 8px 0; }
.check { display: flex; gap: 10px; align-items: baseline; margin: 8px 0; }
.check .ok { color: var(--pass); font-weight: 700; }
.check .no { color: var(--muted); font-weight: 700; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 18px; border-radius: 4px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }


.honest { border-left: 4px solid var(--warn); background: var(--sheet); padding: 12px 16px; border-radius: 4px; margin: 16px 0 20px; max-width: 80ch; }
figure.arch { margin: 0 0 20px; padding: 16px 16px 12px; overflow-x: auto; }
figure.arch svg { display: block; width: 100%; min-width: 760px; height: auto; }
figure.arch figcaption { color: var(--muted); font-size: 13px; margin-top: 10px; }
.arch .node { cursor: pointer; }
.arch .node rect { fill: var(--sheet); stroke: var(--rented); stroke-width: 1.5; }
.arch .node.ext rect { stroke-dasharray: 6 4; fill: var(--paper); }
.arch .node text { fill: var(--ink); font-size: 13.5px; font-weight: 600; }
.arch .node text.sub { fill: var(--muted); font-size: 11.5px; font-weight: 400; }
.arch .node.sel rect { stroke: var(--ink); stroke-width: 2.5; }
.arch .node.on rect { fill: var(--owned-wash); stroke: var(--owned); stroke-width: 2.5; }
.arch .node:focus-visible { outline: none; }
.arch .node:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.arch .edge path { fill: none; stroke: var(--rented); stroke-width: 1.5; marker-end: url(#a); }
.arch .edge text { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.arch .edge.on path { stroke: var(--owned); stroke-width: 3; marker-end: url(#b); }
.arch .edge.on text { fill: var(--owned); font-weight: 700; }
.arch marker path.a { fill: var(--rented); }
.arch marker path.b { fill: var(--owned); }
.detail { margin-bottom: 28px; }
.detail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.detail h2 { margin: 0; }
.detail h3 { font-size: 13.5px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
.detail p { margin: 8px 0 0; max-width: 80ch; }
.where { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
.badge { font-size: 12.5px; border: 1px solid var(--warn); color: var(--warn); border-radius: 3px; padding: 2px 8px; }
.badge a { color: inherit; }
ul.calls { margin: 0; padding-left: 18px; }
ul.calls li { margin: 4px 0; }
ul.calls code { white-space: pre-wrap; word-break: break-word; }
.risk { border-left: 3px solid var(--fail); padding-left: 10px; }
.sys-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-bottom: 28px; }
@media (max-width: 960px) { .sys-grid { grid-template-columns: minmax(0, 1fr); } }
.wire { max-height: 420px; overflow: auto; }
.wire ol { list-style: none; margin: 0; padding: 0; }
.wire li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.wire li:last-child { border-bottom: 0; }
.wire li.fresh { animation: fresh 1.6s ease-out; }
.wire time { color: var(--muted); font-size: 12px; padding-top: 1px; }
.wire .who { font-weight: 600; margin-bottom: 3px; }
.wire .who a { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
.wire code { display: block; white-space: pre-wrap; word-break: break-word; color: var(--owned); }
.wire .res { color: var(--muted); margin-top: 3px; word-break: break-word; }
.wire .empty { padding: 16px; margin: 0; color: var(--muted); }
pre.term { background: #0E1422; color: #D5DAE3; border-radius: 6px; padding: 14px 16px; height: 420px; overflow: auto; margin: 0; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
pre.term .c { color: #B9BCFF; }
pre.term .d { color: #9AA3B4; }
pre.term .p, pre.term .add { color: #4CC08E; }
pre.term .f, pre.term .del { color: #FF7A6E; }
pre.filebox { max-height: 320px; margin-top: 0; border-top-left-radius: 0; }
@media (prefers-reduced-motion: reduce) { .wire li.fresh { animation: none; } }

@media (prefers-reduced-motion: reduce) {
  .stamp.land, .log .fresh { animation: none; }
  .trainbar b { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Graduate</a>
    <nav class="primary" aria-label="Main">
      <a href="#/" data-nav="overview">Overview</a>
      <a href="#/system" data-nav="system">Under the hood</a>
      <a href="#/setup" data-nav="setup">Setup</a>
    </nav>
    <div class="proxy"><span class="dot" aria-hidden="true"></span>Proxy running on localhost:4141</div>
  </div>
</header>

<div class="mockbar" role="region" aria-label="Mock-up controls">
  <div class="wrap">
    <strong>Mock-up controls</strong>
    <button class="btn sm primary" id="play">Play the demo story</button>
    <button class="btn sm" id="fail" disabled>Force a failure</button>
    <button class="btn sm quiet" id="reset">Reset</button>
    <span id="storyhint" style="color:var(--muted)">Sample data only. Open “Under the hood” to see every call.</span>
  </div>
</div>

<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const N = 5;
const STATES = ["LEARNING", "READY", "TRAINING", "GRADUATED", "PROBATION"];
const STATE_TEXT = { LEARNING: "Learning", READY: "Ready to train", TRAINING: "Training", GRADUATED: "Graduated", PROBATION: "On probation" };
const FAIL_LIMIT = 3;

function seed() {
  return {
    savedUsd: 38.64, routedRuns: 131, unclassified: 41,
    awaitingConsent: false, story: 0,
    tasks: {
      "fix-failing-test": {
        title: "Fix a failing test", state: "LEARNING", verified: 4, failed: 1, consent: false,
        verify: "pytest tests/", trainPct: 0,
        baseline: { turns: 16, tools: 5, cost: 0.42, secs: 94 }, current: null,
        model: null, trainedOn: 0, sinceGrad: 0, failsSinceGrad: 0,
        runs: [
          { t: "14:21", req: "Fix failing test in module_4", to: "frontier", turns: 15, tools: 5, cost: 0.40, exit: 0 },
          { t: "14:09", req: "Fix failing test in module_3", to: "frontier", turns: 17, tools: 6, cost: 0.45, exit: 0 },
          { t: "13:58", req: "Fix failing test in module_7", to: "frontier", turns: 19, tools: 7, cost: 0.51, exit: 1 },
          { t: "13:40", req: "Fix failing test in module_2", to: "frontier", turns: 16, tools: 5, cost: 0.42, exit: 0 },
          { t: "13:22", req: "Fix failing test in module_1", to: "frontier", turns: 16, tools: 4, cost: 0.41, exit: 0 },
        ],
      },
      "update-changelog": {
        title: "Update the changelog", state: "GRADUATED", verified: 6, failed: 0, consent: true,
        verify: "python scripts/check_changelog.py", trainPct: 100,
        baseline: { turns: 9, tools: 4, cost: 0.18, secs: 41 }, current: { turns: 2, tools: 2, cost: 0.004, secs: 6 },
        model: "river://run-4c1e/sampler_weights/update-changelog-v1", trainedOn: 6, sinceGrad: 23, failsSinceGrad: 0, graduatedAt: "Sat 21:40",
        runs: [
          { t: "14:30", req: "Add 0.4.2 entry", to: "owned", turns: 2, tools: 2, cost: 0.004, exit: 0 },
          { t: "14:02", req: "Add 0.4.1 entry", to: "owned", turns: 2, tools: 2, cost: 0.005, exit: 0 },
          { t: "13:11", req: "Add 0.4.0 entry", to: "owned", turns: 3, tools: 2, cost: 0.006, exit: 0 },
        ],
      },
      "add-endpoint": {
        title: "Add an API endpoint", state: "LEARNING", verified: 2, failed: 0, consent: false,
        verify: "pytest tests/api", trainPct: 0,
        baseline: { turns: 22, tools: 9, cost: 0.71, secs: 160 }, current: null,
        model: null, trainedOn: 0, sinceGrad: 0, failsSinceGrad: 0,
        runs: [
          { t: "12:50", req: "Add GET /users/:id", to: "frontier", turns: 21, tools: 9, cost: 0.69, exit: 0 },
          { t: "11:32", req: "Add POST /orders", to: "frontier", turns: 23, tools: 10, cost: 0.74, exit: 0 },
        ],
      },
      "bump-dependency": {
        title: "Bump a dependency", state: "PROBATION", verified: 7, failed: 3, consent: true,
        verify: "pytest && ruff check", trainPct: 100,
        baseline: { turns: 12, tools: 6, cost: 0.31, secs: 70 }, current: { turns: 4, tools: 3, cost: 0.012, secs: 11 },
        model: "river://run-9a07/sampler_weights/bump-dependency-v1", trainedOn: 7, sinceGrad: 9, failsSinceGrad: 3, graduatedAt: "Sat 22:15",
        runs: [
          { t: "13:05", req: "Bump httpx to 0.29", to: "owned → frontier", turns: 4, tools: 3, cost: 0.29, exit: 1 },
          { t: "12:40", req: "Bump pydantic to 2.12", to: "owned → frontier", turns: 5, tools: 3, cost: 0.33, exit: 1 },
          { t: "12:12", req: "Bump ruff to 0.8", to: "owned → frontier", turns: 4, tools: 3, cost: 0.27, exit: 1 },
        ],
      },
    },
    wire: [], term: [], hi: { n: [], e: [] }, sesslog: [], sel: "router", fileTab: "registry",
    ledger: [

function stateCell(k, t) {

    extra = `<div class="trainbar" role="progressbar" aria-valuenow="${t.trainPct}" aria-valuemin="0" aria-valuemax="100"><b style="width:${t.trainPct}%"></b></div>`;

function viewTask(k) {
  const t = S.tasks[k];
  if (!t) return `<a class="back" href="#/">Back to overview</a><h1>No task type called “${esc(k)}”</h1><p class="lede">Pick one from the overview.</p>`;
  const idx = STATES.indexOf(t.state);
  const flow = ["LEARNING", "READY", "TRAINING", "GRADUATED", "PROBATION"];
  const life = flow.map((s, i) => {
    const onPath = t.state === "PROBATION" ? i <= 4 : i <= idx;
    const cls = s === t.state ? `now ${s}` : (onPath && i < (t.state === "PROBATION" ? 4 : idx) ? "done" : "");
    const hint = { LEARNING: `Under ${N} verified runs`, READY: `${N} verified runs, waiting for approval`, TRAINING: "Training on River from this machine", GRADUATED: "Routed to your model, verified every run", PROBATION: "Failed too often, back on frontier" }[s];
    return `<li class="${cls}"><b>${STATE_TEXT[s]}</b>${hint}</li>`;
  }).join("");
  const stamp = t.state === "GRADUATED"
    ? `<div class="stamp ${justGraduated === k ? "land" : ""}">Graduated<small>${esc(t.graduatedAt || now())} · ${t.trainedOn} runs</small></div>`
    : t.state === "PROBATION" ? `<div class="stamp probation">Probation<small>${t.failsSinceGrad} failed checks</small></div>` : "";
  if (justGraduated === k) justGraduated = null;

  const b = t.baseline, c = t.current;
  const bar = (label, unit, bv, cv, fmt = (x) => x) => {
    const max = Math.max(bv, cv ?? 0) || 1;
    return `<div class="metric"><div class="label"><span>${label}</span><span>${cv != null ? Math.round((1 - cv / bv) * 100) + "% less" : "Not graduated yet"}</span></div>
      <div class="bar rented"><span>Frontier</span><span class="track"><span class="fill" style="width:${(bv / max) * 100}%;display:block"></span></span><span class="v">${fmt(bv)}${unit}</span></div>
      ${cv != null ? `<div class="bar owned"><span>Your model</span><span class="track"><span class="fill" style="width:${Math.max((cv / max) * 100, 1.5)}%;display:block"></span></span><span class="v">${fmt(cv)}${unit}</span></div>` : ""}
    </div>`;
  };
  const actions = [];
  if (t.state === "READY" && !t.consent) actions.push(`<a class="btn owned" href="#/consent/${k}">Review training data</a>`);
  if (t.state === "GRADUATED") actions.push(`<button class="btn" data-act="demote" data-k="${k}">Send back to frontier</button>`);
  if (t.state === "PROBATION") actions.push(`<a class="btn owned" href="#/consent/${k}">Retrain with the failed runs</a>`);

  return `
    <a class="back" href="#/">Back to overview</a>
    <div class="detail-head">
      <div><h1>${esc(t.title)}</h1><p class="lede">Verified by <code>${esc(t.verify)}</code>. ${t.verified} passing runs, ${t.failed} failing.</p></div>
      ${stamp}
    </div>
    <ol class="lifecycle" aria-label="Lifecycle">${life}</ol>
    <div class="grid2">
      <section class="sheet pad" aria-labelledby="cmp-h">
        <h2 id="cmp-h">Frontier versus your model, per run</h2>
        <div class="compare">
          ${bar("Turns", "", b.turns, c?.turns)}
          ${bar("Tool calls", "", b.tools, c?.tools)}
          ${bar("Cost", "", b.cost, c?.cost, money)}
          ${bar("Time", "s", b.secs, c?.secs)}
        </div>
        <p class="note">Frontier numbers are the average of this task type's verified runs with prompt caching on.</p>
      </section>
      <section class="sheet pad" aria-labelledby="facts-h">
        <h2 id="facts-h">Model</h2>
        <dl class="facts">
          <dt>State</dt><dd><span class="state ${t.state}">${STATE_TEXT[t.state]}</span></dd>
          <dt>Model</dt><dd>${t.model ? `<code>${esc(t.model)}</code>` : "None yet"}</dd>
          <dt>Trained on</dt><dd>${t.trainedOn ? `${t.trainedOn} verified runs` : "Not trained"}</dd>
          <dt>Since graduating</dt><dd>${t.model ? `${t.sinceGrad} passed, ${t.failsSinceGrad} failed (limit ${FAIL_LIMIT})` : "—"}</dd>
          <dt>Training data</dt><dd>${t.consent ? "Approved" : "Not approved"}</dd>
        </dl>
        <div class="actions">${actions.join("")}</div>
      </section>
    </div>
    <section aria-labelledby="runs-h">
      <h2 id="runs-h">Recent runs</h2>
      <div class="sheet tbl-scroll">
        <table class="runs">
          <thead><tr><th>Time</th><th>Request</th><th>Handled by</th><th>Turns</th><th>Tool calls</th><th>Cost</th><th>Verify</th></tr></thead>
          <tbody>${t.runs.map((r) => `<tr><td>${r.t}</td><td>${esc(r.req)}</td><td>${r.to === "owned" ? `<span style="color:var(--owned);font-weight:600">Your model</span>` : r.to === "frontier" ? "Frontier" : "Your model, then frontier"}</td><td>${r.turns}</td><td>${r.tools}</td><td>${money(r.cost)}</td><td class="exit${r.exit ? 1 : 0}">exit ${r.exit}</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </section>`;
}

function viewConsent(k) {
  const t = S.tasks[k];

  const n = t.state === "PROBATION" ? t.verified + t.failed : Math.min(t.verified, 99);

    metadata: { task_type: k, verify_command: t.verify, exit_code: 0, tool_calls: t.runs[0].tools },
  };
  return `
    <div class="consent">
      <a class="back" href="#/task/${k}">Back to ${esc(t.title.toLowerCase())}</a>
      <h1>Send ${n} runs to River to train “${esc(t.title)}”?</h1>

function render() {
  const h = location.hash || "#/";
  const [, route, arg] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach((a) => a.removeAttribute("aria-current"));
  let html;
  if (route === "task") html = viewTask(decodeURIComponent(arg || ""));
  else if (route === "consent") html = viewConsent(decodeURIComponent(arg || ""));
  else if (route === "setup") { watching = false; html = viewSetup(); $('[data-nav="setup"]').setAttribute("aria-current", "page"); }
  else if (route === "system") { watching = true; html = viewSystem(); $('[data-nav="system"]').setAttribute("aria-current", "page"); }
  else { watching = false; html = viewOverview(); $('[data-nav="overview"]').setAttribute("aria-current", "page"); }
  $("#app").innerHTML = html;
  const tm = $("#term"); if (tm) tm.scrollTop = tm.scrollHeight;
  S.events.forEach((e) => (e.fresh = false));
  if (S.tasks["fix-failing-test"].state !== "GRADUATED") $("#fail").disabled = true;
}

  { id: "verify", d: "M40,48 H22 V268 H40", lx: 30, ly: 216, t: "verify", a: "start" },
  { id: "exit", d: "M135,296 V350", lx: 141, ly: 327, t: "exit code", a: "start" },
  { id: "tail", d: "M230,378 H290", lx: 260, ly: 372, t: "tails", a: "middle" },
  { id: "ready", d: "M480,378 H530 V278 H580", lx: 536, ly: 332, t: "5 passing → Ready", a: "start" },
  { id: "ask", d: "M770,268 H820", lx: 795, ly: 262, t: "asks", a: "middle" },
  { id: "approved", d: "M915,296 V350", lx: 921, ly: 327, t: "approved", a: "start" },
  { id: "train", d: "M820,392 H770", lx: 795, ly: 418, t: "trains", a: "middle" },
  { id: "serve", d: "M770,362 H796 V158 H770", lx: 802, ly: 205, t: "checkpoint", a: "start" },
  { id: "graduate", d: "M870,350 V316 H720 V296", lx: 752, ly: 311, t: "Graduated", a: "middle" },
  { id: "state", d: "M960,186 V214 H745 V240", lx: 952, ly: 208, t: "GET /state", a: "end" },
  { id: "failed", d: "M135,406 V460", lx: 141, ly: 437, t: "your model failed", a: "start" },
  { id: "rerun", d: "M230,488 H260 V178 H290", lx: 266, ly: 470, t: "rerun on frontier", a: "start" },
];

function archSvg() {
  const on = new Set(S.hi.n), eon = new Set(S.hi.e);
  const edges = EDGES.map((e) => `<g class="edge${eon.has(e.id) ? " on" : ""}"><path d="${e.d}"/><text x="${e.lx}" y="${e.ly}" text-anchor="${e.a}">${e.t}</text></g>`).join("");
  const nodes = Object.values(NODE).map((n) => `<g class="node${n.ext ? " ext" : ""}${on.has(n.id) ? " on" : ""}${S.sel === n.id ? " sel" : ""}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}: ${esc(n.sub)}">
      <rect x="${n.x}" y="${n.y}" width="${BW}" height="${BH}" rx="6"/>
      <text x="${n.x + 14}" y="${n.y + 24}">${esc(n.label)}</text>
      <text class="sub" x="${n.x + 14}" y="${n.y + 42}">${esc(n.sub)}</text></g>`).join("");
  return `<svg viewBox="0 0 1030 530" role="img" aria-label="GRADUATE architecture: the runner launches OpenCode, whose model calls go through the router to OpenAI or your River model; the test suite's exit code goes to the ledger, the watcher marks task types ready, you approve, and the registrar trains on River and marks them graduated.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="b" d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>${edges}${nodes}</svg>`;
}

function nodeDetail() {
  const n = NODE[S.sel];
  const list = (a) => `<ul class="calls">${a.map((c) => `<li><code>${esc(c)}</code></li>`).join("")}</ul>`;
  return `<div class="sheet pad detail">
    <div class="detail-top"><h2>${esc(n.label)} <span class="where">${n.ext ? "Outside service" : "On your machine"}</span></h2>
      <span class="badge">Not built yet · ${n.issues.map((i) => `<a href="${GH}${i}" target="_blank" rel="noopener">#${i}</a>`).join(" ")}</span></div>
    <p>${esc(n.what)}</p>
    ${n.calls ? `<h3>Calls it makes</h3>${list(n.calls)}` : ""}
    ${n.files ? `<h3>Writes</h3>${list(n.files)}` : ""}
    ${n.leaves ? `<h3>What leaves your machine</h3><p>${esc(n.leaves)}</p>` : ""}
    ${n.risk ? `<p class="risk"><strong>Open risk.</strong> ${esc(n.risk)}</p>` : ""}
  </div>`;
}

function regJson() {
  const o = {};
  for (const [k, t] of Object.entries(S.tasks)) o[k] = { state: t.state, consent: t.consent, verified_runs: t.verified, failed_runs: t.failed, verify_command: t.verify, model: t.model, failures_since_graduation: t.failsSinceGrad };
  return JSON.stringify(o, null, 2);
}

function viewSystem() {
  const t = S.tasks["fix-failing-test"];
  const files = {
    registry: regJson(),
    ledger: S.ledger.slice(-8).map((r) => JSON.stringify(r)).join("\n"),
    session: S.sesslog.slice(-4).map((r) => JSON.stringify(r)).join("\n") || "No calls logged yet. Press “Play the demo story”.",
  };
  const ft = S.fileTab;
  return `
    <h1>Under the hood</h1>
    <p class="lede">What each part does, what it calls, and where your data goes. Press <strong>Play the demo story</strong> and watch the parts light up as each call happens.</p>
    <p class="honest"><strong>Nothing on this page is built yet.</strong> This is the planned design. Every call is named from the sponsor's own docs (checked Sep 26), each part links to the GitHub issue that builds it, and the numbers are samples.</p>
    ${t.state === "READY" && !t.consent ? `<div class="banner"><p>The watcher counted 5 passing runs. Nothing goes to River until you approve.</p><a class="btn owned" href="#/consent/fix-failing-test">Review training data</a></div>` : ""}
    <figure class="arch sheet">
      ${archSvg()}
      <figcaption>Solid boxes run on your machine. Dashed boxes are outside services, so data leaves your machine there. Indigo is what's happening right now. Click any box for its calls.</figcaption>
    </figure>
    ${nodeDetail()}
    <div class="sys-grid">
      <section aria-labelledby="wire-h">
        <h2 id="wire-h">Every call, newest first</h2>
        <div class="sheet wire">${S.wire.length ? `<ol>${S.wire.map((w) => `<li class="${w.fresh ? "fresh" : ""}"><time>${w.t}</time><div><div class="who">${esc(w.who)} <a href="${GH}${w.issue}" target="_blank" rel="noopener">#${w.issue}</a></div><code>${esc(w.call)}</code><div class="res">${esc(w.res)}</div></div></li>`).join("")}</ol>` : `<p class="empty">No calls yet. Press “Play the demo story”.</p>`}</div>
      </section>
      <section aria-labelledby="term-h">
        <h2 id="term-h">Terminal</h2>
        <pre class="term" id="term">${S.term.length ? S.term.map(([k, l]) => `<span class="${k}">${esc(l)}</span>`).join("\n") : `<span class="d">Waiting for a task…</span>`}</pre>
        <p class="note">This is the part of the demo people can see with their own eyes: a real agent editing real code, and the tests going from red to green.</p>
      </section>
    </div>
    <section aria-labelledby="files-h">
      <h2 id="files-h">Files on disk</h2>
      <div class="tabs" role="tablist">${[["registry", "registry.json"], ["ledger", "ledger.jsonl"], ["session", "sessions/…jsonl"]].map(([k, l]) => `<button role="tab" aria-selected="${ft === k}" data-file="${k}">${l}</button>`).join("")}</div>
      <pre class="sample filebox">${esc(files[ft])}</pre>
    </section>`;
}

let watching = false;
function go(h) { location.hash = watching ? "#/system" : h; }
function hi(n, e) { S.hi = { n, e }; }
function wire(who, call, res, issue) { S.wire.forEach((w) => (w.fresh = false)); S.wire.unshift({ t: clock(), who, call, res, issue, fresh: true }); }
function term(...lines) { S.term.push(...lines); }
function clock() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map((x) => String(x).padStart(2, "0")).join(":"); }
function sid() { return "sess-" + Math.random().toString(16).slice(2, 8); }
function later(ms, fn) { timers.push(setTimeout(() => { fn(); render(); }, ms)); }
function seq(steps, gap = 1300, start = 200) { steps.forEach((fn, i) => later(start + i * gap, fn)); return start + steps.length * gap; }

function sessionSteps(o) {
  const s = o.sid, p = `The test tests/test_mod_${o.mod}.py is failing. Fix the code so it passes.`;
  const up = o.owned ? "river" : "openai";
  return [
    () => { hi(["runner", "opencode"], ["launch"]); wire("Runner → OpenCode", `opencode run "${p}"`, `env GRADUATE_SESSION=${s}${o.force ? " · x-graduate-force: frontier" : ""}`, 34);
      term(["c", `$ graduate run --task-file demo-repo/tasks/${o.mod}.json --repo demo-repo${o.force ? " --force-frontier" : ""}`], ["d", `session ${s} · launching opencode`]); },
    () => { hi(["opencode", "router", "memorable"], ["chat", "recall"]); wire("OpenCode → Router", "POST http://localhost:4141/v1/chat/completions", `Authorization: Bearer ${s} · stream: true · 7 tools`, 13);
      wire("Router → Memorable", `memorable recall "${p.slice(0, 38)}…" --single`, "0.91 procedures/7c2e19ab-fix-failing-test [lexical] · 41 ms → task type fix-failing-test", 20); },
    () => { hi(["router", "registry", up], ["reads", o.owned ? "owned" : "frontier"]);
      wire("Router → registry.json", `registry["fix-failing-test"].state`, o.owned ? "GRADUATED → route to your River model" : `${o.force ? "forced by header" : S.tasks["fix-failing-test"].state} → route to frontier`, 20);
      if (o.owned) wire("Router → River", "POST <deployment.base_url>/chat/completions  model=<deployment.model>", "strip <think> blocks · stream back to OpenCode · fallback: chat_complete_from_checkpoint", 37);
      else wire("Router → OpenAI", "POST https://api.openai.com/v1/chat/completions  stream_options.include_usage=true", "streamed back untouched · usage: 18,231 in (16,384 cached) · 412 out", 13);
      term(["d", "▸ read tests/test_mod_" + o.mod + ".py"]); },
    () => { hi(["router", "disk"], ["log"]); wire("Router → Session log", `append sessions/${s}.jsonl · metrics.jsonl`, `turn 1 · ${o.owned ? "$0.004" : "$0.021"}`, 35);
      S.sesslog.push({ ts: clock(), session: s, upstream: up, model: o.owned ? "river://…/fix-failing-test-v1" : "gpt-frontier", usage: o.owned ? { in: 2210, out: 180 } : { in: 18231, cached: 16384, out: 412 }, latency_ms: o.owned ? 640 : 2310 });
      term(["d", "▸ read calc/mod_" + o.mod + ".py"], ["d", "▸ bash pytest -q tests/test_mod_" + o.mod + ".py"], ["f", "  FAILED test_add_negative - assert -1 == 5"]); },
    () => { hi(["opencode", "router", up], ["chat", o.owned ? "owned" : "frontier"]);
      wire("OpenCode → Router", `turns 2–${o.turns}: same path`, `${o.turns} turns · ${o.tools} tool calls · ${money(o.cost)} total`, 17);
      term(["d", "▸ edit calc/mod_" + o.mod + ".py"], ["del", "-    return a - b"], ["add", "+    return a + b"]);
      if (!o.fail) term(["d", "▸ bash pytest -q tests/test_mod_" + o.mod + ".py"], ["p", "  1 passed in 0.04s"]);
      term(["d", "opencode exited"]); },
    () => { hi(["runner", "pytest"], ["verify"]); wire("Runner → Test suite", `pytest -q tests/test_mod_${o.mod}.py`, o.fail ? "exit 1 · 1 failed" : "exit 0 · 1 passed", 34);
      term(["c", `$ pytest -q tests/test_mod_${o.mod}.py   (verify, run by graduate)`], o.fail ? ["f", "1 failed in 0.05s · exit 1"] : ["p", "1 passed in 0.04s · exit 0"]); },
    () => { const row = { session_id: s, task_type: "fix-failing-test", routed_to: o.force ? "frontier" : o.owned ? "owned" : "frontier", turns: o.turns, tool_calls: o.tools, cost_usd: o.cost, exit_code: o.fail ? 1 : 0, ...(o.from ? { escalated_from: o.from } : {}) };
      S.ledger.push(row);
      hi(o.fail ? ["pytest", "ledger"] : ["pytest", "ledger", "runner", "memorable"], o.fail ? ["exit"] : ["exit", "ingest"]);
      wire("Runner → ledger.jsonl", "append row", JSON.stringify(row), 34);
      if (!o.fail) wire("Runner → Memorable", `memorable ingest data/traces/${s}.json`, "procedure 7c2e19ab updated · harness opencode · verify exit_code 0", 36);
      o.after && o.after(); },
  ];
}

function play() {
  const t = S.tasks["fix-failing-test"];
  if (t.state !== "LEARNING") { toast("Reset first to replay the story."); return; }
  $("#play").disabled = true; S.term = [];
  $("#storyhint").textContent = "Open “Under the hood” to watch every call.";
  log(`New request: “Fix failing test in module_5”. Matched <strong>fix-failing-test</strong>. No graduated model yet, so it goes to frontier.`);
  const end = seq([...sessionSteps({ sid: sid(), mod: "05", turns: 16, tools: 5, cost: 0.42, after: () => {
      t.runs.unshift({ t: now(), req: "Fix failing test in module_5", to: "frontier", turns: 16, tools: 5, cost: 0.42, exit: 0 });
      log(`Verify <code>pytest tests/test_mod_05.py</code>: <span class="pass">exit 0</span>. fix-failing-test has ${N} of ${N} verified runs.`);
    } }),
    () => { hi(["ledger", "watcher", "registry"], ["tail", "ready"]); t.verified = 5; t.state = "READY";
      wire("Watcher → registry.json", "verified_runs(\"fix-failing-test\") = 5   (bar: 5)", "state READY · consent not given yet → ask you", 19); },
    () => { hi(["registry", "consent"], ["ask"]); S.awaitingConsent = true;
      wire("registry.json → You", "event: ready to graduate", "waiting for approval on the consent screen", 25);
      log(`fix-failing-test is ready to graduate. Waiting for you to approve the training data.`);
      $("#storyhint").textContent = "Your turn: click “Review training data”."; }]);
  return end;
}

function approve(k) {
  const t = S.tasks[k];
  const retrain = t.state === "PROBATION";
  const n = retrain ? t.verified + t.failed : t.verified;
  t.consent = true; t.state = "TRAINING"; t.trainPct = 0; S.awaitingConsent = false;
  hi(["consent", "registrar"], ["approved"]);
  wire("Dashboard → Router", `POST /api/consent/${k}`, `consent = true · spawned: python -m graduate.registrar.train ${k}`, 25);
  term(["c", `$ python -m graduate.registrar.train ${k}`]);
  log(`Approved. Training started on River with ${n} runs.`);
  toast("Approved. Training started.");
  go("#/");
  $("#storyhint").textContent = "Training on River. In the real product this takes minutes, not seconds.";
  const ck = `river://run-${Math.random().toString(16).slice(2, 6)}/sampler_weights/${k}-v${retrain ? 2 : 1}`;
  const losses = [2.41, 1.98, 1.62, 1.31, 1.07, 0.88, 0.72, 0.61, 0.52, 0.46];
  const steps = [
    () => { hi(["registrar", "disk"], []); wire("Registrar", `dataset.py: ${n} passing sessions from sessions/*.jsonl`, `81 examples → tokenizer.apply_chat_template(messages, tools=…) → 81 × {input_ids, target_tokens, weights} · 312k tokens`, 21);
      term(["d", `dataset: ${n} sessions → 81 examples · 312k tokens → data/${k}.tok.jsonl`]); },
    () => { hi(["registrar", "rivertrain"], ["train"]); wire("Registrar → River training", `session.create_model("Qwen3.6-35B-A3B-FP8", lora=LoraConfig(rank=32))`, "LoRA model created · rank 32", 22);
      term(["d", "river: create_model Qwen3.6-35B-A3B-FP8 · LoRA rank 32"]); },
    ...losses.map((l, i) => () => { hi(["registrar", "rivertrain"], ["train"]); t.trainPct = (i + 1) * 10;
      if (i === 0) wire("Registrar → River training", `model.train_step(batch, loss_fn="cross_entropy", lr=2e-4)   × 15`, "loss per step written to data/" + k + ".loss.jsonl", 22);
      term(["d", `train step ${String(i + 1).padStart(2)}/15 · loss ${l.toFixed(2)}`]); }),
    () => { hi(["rivertrain", "river"], ["serve"]); wire("Registrar → River training", `model.save_weights("${k}-v${retrain ? 2 : 1}", mode="inference")`, ck, 22);
      wire("Registrar → River", "client.create_deployment(checkpoint=…, unified_replicas=1, wait=True)", "only if River enabled deployments; otherwise serve from the checkpoint", 37);
      term(["p", `saved ${ck}`]); },
    () => { hi(["registrar", "registry"], ["graduate"]);
      t.state = "GRADUATED"; t.model = ck; t.trainedOn = n; t.current = t.current || { turns: 3, tools: 3, cost: 0.011, secs: 9 };
      t.graduatedAt = now(); t.sinceGrad = 0; t.failsSinceGrad = 0; justGraduated = k;
      wire("Registrar → registry.json", `transition("${k}", "GRADUATED", model="${ck}")`, "router picks this up on its next registry reload", 18);
      log(`<span class="owned">${k} graduated.</span> Model <code>${ck}</code>. Matching requests now go to your model.`);
      go(`#/task/${k}`); },
  ];
  const end = seq(steps, 480, 300);
  if (k !== "fix-failing-test" || retrain) return;
  timers.push(setTimeout(() => {
    seq(sessionSteps({ sid: sid(), mod: "06", owned: true, turns: 3, tools: 3, cost: 0.011, after: () => {
      t.runs.unshift({ t: now(), req: "Fix failing test in module_6", to: "owned", turns: 3, tools: 3, cost: 0.011, exit: 0 });
      t.sinceGrad++; S.routedRuns++; S.savedUsd += 0.42 - 0.011;
      log(`“Fix failing test in module_6” went to <span class="owned">your model</span>. 3 turns instead of 16. Verify <span class="pass">exit 0</span>. Saved $0.41.`);
      $("#storyhint").textContent = "Now try “Force a failure” to see the safety path.";
      $("#fail").disabled = false;
    } }), 1100);
  }, end + 1500));
}

function forceFail() {
  const t = S.tasks["fix-failing-test"];
  if (t.state !== "GRADUATED") return;
  $("#fail").disabled = true;
  const s1 = sid(), s2 = sid();
  const first = sessionSteps({ sid: s1, mod: "08", owned: true, fail: true, turns: 3, tools: 3, cost: 0.011 });
  const esc1 = [
    () => { hi(["ledger", "escalator"], ["failed"]); wire("Escalator", `git diff > sessions/${s1}.diff`, "failed attempt kept for review", 23);
      term(["c", "$ graduate: your model failed verification → escalating"], ["d", `git diff > sessions/${s1}.diff`]); },
    () => { hi(["escalator"], []); wire("Escalator", "git checkout -- . && git clean -fd", "repo back to the starting commit", 23); term(["d", "git checkout -- . && git clean -fd"]); },
    () => { hi(["escalator", "router", "openai"], ["rerun", "frontier"]); wire("Escalator → Runner", "graduate run --force-frontier", `new session ${s2} · linked escalated_from=${s1}`, 23); },
  ];
  const rerun = sessionSteps({ sid: s2, mod: "08", force: true, from: s1, turns: 16, tools: 5, cost: 0.42, after: () => {
    t.failsSinceGrad++; t.failed++;
    t.runs.unshift({ t: now(), req: "Fix failing test in module_8", to: "owned → frontier", turns: 19, tools: 8, cost: 0.431, exit: 0 });
    wire("Escalator", `append data/fix-failing-test.neg.jsonl`, `negative example saved · failures ${t.failsSinceGrad} of ${FAIL_LIMIT}`, 23);
    log(`Your model failed on module_8, so it was rerun on frontier: verify <span class="pass">exit 0</span>. The failed attempt is saved as a negative example (${t.failsSinceGrad} of ${FAIL_LIMIT} before probation).`);
    if (t.failsSinceGrad >= FAIL_LIMIT) {
      t.state = "PROBATION";
      wire("Escalator → registry.json", `transition("fix-failing-test", "PROBATION")`, "router sends this task type to frontier until it retrains", 23);
      log(`<span class="fail">fix-failing-test moved to probation.</span> Requests go to frontier until it retrains.`);
    } else $("#fail").disabled = false;
  } });
  log(`“Fix failing test in module_8” went to <span class="owned">your model</span>.`);
  seq([...first, ...esc1, ...rerun], 900);
}

function demote(k) {
  const t = S.tasks[k];
  t.state = "PROBATION";
  log(`You sent ${k} back to frontier. Its model is kept, but nothing is routed to it.`);
  toast("Sent back to frontier.");
}

function reset() {
  timers.forEach(clearTimeout); timers = [];
  const sel = S.sel, ft = S.fileTab;
  S = seed(); S.sel = sel; S.fileTab = ft; justGraduated = null;
  $("#play").disabled = false;
  $("#storyhint").textContent = "Sample data only. Open “Under the hood” to see every call.";
  go("#/");
  render();
}

document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) { const k = act.dataset.k; ({ approve, demote })[act.dataset.act](k); render(); return; }
  const node = e.target.closest("[data-node]");
  if (node) { S.sel = node.dataset.node; render(); return; }
  const file = e.target.closest("[data-file]");
  if (file) { S.fileTab = file.dataset.file; render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { viewSetup.sel = tab.dataset.tab; render(); return; }
  const row = e.target.closest("tr[data-go]");
  if (row && !e.target.closest("a")) location.hash = row.dataset.go;
});
$("#play").addEventListener("click", play);
$("#fail").addEventListener("click", forceFail);
$("#reset").addEventListener("click", reset);
document.addEventListener("keydown", (e) => {
  const node = e.target.closest && e.target.closest("[data-node]");
  if (node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); S.sel = node.dataset.node; render(); $(`[data-node="${S.sel}"]`)?.focus(); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
