name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # Namespace runners: switch to namespace-profile-default once the Namespace app is on the repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # river-client (the [train] extra) needs Python 3.12 (#51), and make check's dataset self-check (#21) needs it.
      # On 3.11, make test still runs every other self-check and skips that one.
      - run: pip install -e .[test${{ matrix.python == '3.12' && ',train' || '' }}]
      - run: make check
        if: matrix.python == '3.12'
      - run: make test

  # $0 end to end (#65): real OpenCode + demo-repo pytest against the stub upstream, beside the test matrix.
  e2e-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.32 --no-modify-path
      - run: make e2e-replay
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-replay
          path: |
            backups/
            terminal.log

  # The stage demo from a clean checkout (#97): scripts/demo.sh --offline on the stub frontier, real OpenCode, $0.
  # --use-checkpoint river://: no River key here, so step 5 shows the fall-back to the frontier. ~1 min.
  demo-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test] 'river-client>=0.12,<0.13'  # the dataset step; torch is not needed
      - run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.32 --no-modify-path
      - run: scripts/demo.sh --offline --auto-approve --use-checkpoint river://run-ci/sampler_weights/fix-failing-test-v1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-offline
          path: backups/demo-*/
